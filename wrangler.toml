name = "shopee-price-tracker"
main = "src/worker.js"
compatibility_date = "2026-10-27"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "shopee-tracker"
# Replace this with the ID returned by: npx wrangler d1 create shopee-tracker
database_id = "bf3e6e03-69df-420e-926e-f3907812b36a"

[vars]
# These are IDs, not secrets. Replace each value before deployment.
INPUT_CHANNEL_ID = "REPLACE_WITH_INPUT_CHANNEL_ID"
UPDATE_CHANNEL_ID = "REPLACE_WITH_UPDATE_CHANNEL_ID"
# Optional but recommended: copy your numeric Discord user ID to restrict commands.
OWNER_USER_ID = ""
# Shopee Affiliate Open API for Thailand.
SHOPEE_AFFILIATE_ENDPOINT = "https://open-api.affiliate.shopee.co.th/graphql"
