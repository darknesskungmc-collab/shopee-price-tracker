name: Legacy GitHub Actions Tracker (disabled)

# Cloudflare Worker is now the active implementation. Retained only as a
# manually runnable fallback while the Worker is being deployed.
on: workflow_dispatch

# Prevent two runs from writing tracked_items.json at the same time.
concurrency:
  group: shopee-price-tracker-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track-price:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Shopee Tracker Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHATBOT_SHOPEE: ${{ secrets.CHATBOT_SHOPEE }}
          UPDATE_PRICE: ${{ secrets.UPDATE_PRICE }}
          SHOPEE_COOKIE: ${{ secrets.SHOPEE_COOKIE }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Commit and Push updated tracked_items.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked_items.json
          git diff --staged --quiet || (git commit -m "chore: update tracked items price data" && git push)
