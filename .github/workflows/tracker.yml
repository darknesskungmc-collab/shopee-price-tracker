name: Shopee Price Tracker

on:
  push:
    branches: [ "main" ]

  schedule:
    - cron: '*/15 * * * *'
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shopee Tracker Script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DISCORD_INPUT_CHANNEL_ID: ${{ secrets.CHATBOT_SHOPEE }}
          DISCORD_ALERT_CHANNEL_ID: ${{ secrets.UPDATE_PRICE }}
          SHOPEE_COOKIE: ${{ secrets.SHOPEE_COOKIE }}
        run: python main.py

      - name: Commit and Push updated tracked_items.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked_items.json
          git diff --staged --quiet || (git commit -m "chore: update tracked items price data" && git push)
